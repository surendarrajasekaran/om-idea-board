name: Infrastructure
on:
  workflow_dispatch:
    inputs:
      cloud:
        type: choice
        options: [aws, gcp]
        required: true
      environment:
        type: choice
        options: [test, staging, production]
        required: true
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: platform-${{ vars.STACK_NAME || 'idea-board' }}-${{ inputs.cloud }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  provision:
    permissions: { contents: read, id-token: write }
    if: github.ref == 'refs/heads/main'
    # Use a runner with fixed egress matching ADMIN_CIDRS; see README.
    runs-on: [self-hosted, linux, idea-board]
    timeout-minutes: 90
    environment: ${{ inputs.cloud }}-${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_administrator_arns: ${{ vars.AWS_ADMINISTRATOR_ARNS || '[]' }}
      TF_INPUT: "false"
      TF_VAR_cloud: ${{ inputs.cloud }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_region: ${{ vars.REGION }}
      TF_VAR_gcp_project: ${{ vars.GCP_PROJECT }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_name: ${{ vars.STACK_NAME || 'idea-board' }}
      TF_VAR_deletion_protection: "true"
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      STATE_KMS_KEY_ARN: ${{ vars.STATE_KMS_KEY_ARN }}
      CLOUD: ${{ inputs.cloud }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Isolate Terraform working files
        run: echo "TF_DATA_DIR=$RUNNER_TEMP/tf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "1.11.4", terraform_wrapper: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          {
            role-to-assume: "${{ vars.AWS_ROLE_ARN }}",
            aws-region: "${{ vars.REGION }}",
          }
      - if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Initialize remote state
        run: python scripts/infra_init.py --cloud "$CLOUD" --environment "$TARGET_ENV" --bucket "$STATE_BUCKET" --region "$TF_VAR_region" --name "$TF_VAR_name" --kms-key-id "$STATE_KMS_KEY_ARN"
      - run: terraform -chdir=infra validate
      - name: Plan selected stack
        env:
          TFVARS_JSON: ${{ vars.INFRA_TFVARS_JSON || '{}' }}
        run: |
          python -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"platform.tfvars.json"; p.write_text(json.dumps(json.loads(os.environ["TFVARS_JSON"]))); p.chmod(0o600)'
          terraform -chdir=infra plan -var-file="$RUNNER_TEMP/platform.tfvars.json" \
            -var="cloud=$CLOUD" -var="environment=$TARGET_ENV" -var="region=$TF_VAR_region" \
            -var="name=$TF_VAR_name" -var="admin_cidrs=$TF_VAR_admin_cidrs" \
            -var="gcp_project=$TF_VAR_gcp_project" -var="deletion_protection=true" -out=release.tfplan
      - if: inputs.operation == 'apply'
        run: terraform -chdir=infra apply release.tfplan
      - name: Explain deployment boundary
        run: echo 'Infrastructure provisioned/planned. Run Release and deploy, or scripts/run_platform.py, to roll out the application.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local sensitive plan
        if: always()
        run: python -c "from pathlib import Path; Path('infra/release.tfplan').unlink(missing_ok=True); import os; (Path(os.environ['RUNNER_TEMP'])/'platform.tfvars.json').unlink(missing_ok=True)"
