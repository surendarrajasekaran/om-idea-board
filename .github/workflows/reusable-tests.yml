name: Release checks
on: workflow_call
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          {
            POSTGRES_USER: ideas,
            POSTGRES_PASSWORD: ci-only-password,
            POSTGRES_DB: ideas,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ideas -d ideas" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/gitops-chart
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: pytest -q backend/tests
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql+psycopg://ideas:ci-only-password@localhost:5432/ideas
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.19.0 }
      - run: python -m unittest discover -s tests -v
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: python3 scripts/security_scan.py config
