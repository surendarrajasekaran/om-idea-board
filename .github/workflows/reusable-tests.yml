name: Release checks
on: workflow_call
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: ideas,
            POSTGRES_PASSWORD: ci-only-password,
            POSTGRES_DB: ideas,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ideas -d ideas" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: pytest -q backend/tests
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql+psycopg://ideas:ci-only-password@localhost:5432/ideas
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - run: python -m unittest discover -s tests -v
      - run: npm ci && npm test && npm run build
        working-directory: frontend
