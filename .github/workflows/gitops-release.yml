name: AWS ECR and Argo CD GitOps release
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - scripts/**
      - .github/gitops-source.json
      - .github/workflows/gitops-release.yml
  workflow_dispatch:
    inputs:
      goal:
        description: AI resource goal for the test environment
        required: true
        default: Cost-sensitive test environment for a small team
      require_ai:
        description: Require a live model response instead of policy fallback
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gitops-idea-board-aws-test
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-tests.yml
  profile:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ vars.AI_ENVIRONMENT || 'aws-test' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Propose and validate test resource profile
        env:
          GOAL: ${{ inputs.goal || 'Cost-sensitive test environment for a small team' }}
          REQUIRE_AI: ${{ inputs.require_ai }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-3.5-flash-lite' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=()
          if [ "$REQUIRE_AI" = "true" ]; then args+=(--require-ai); fi
          python scripts/ai_ops.py "${args[@]}" --show-report --output artifacts/profile.json plan --environment test --goal "$GOAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: gitops-profile, path: artifacts/profile.json }
  images:
    needs: [verify, profile]
    runs-on: ubuntu-latest
    environment: aws-test
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: { service: [frontend, backend] }
    env:
      REGION: ${{ vars.REGION || 'us-west-2' }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
      PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'idea-board-test' }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Isolate Docker credentials
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.REGION || 'us-west-2' }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to ECR with short-lived AWS credentials
        run: aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Immutable image coordinates
        id: image
        run: echo "reference=$REGISTRY/$PREFIX/$SERVICE:git-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          provenance: mode=max
          sbom: true
      - name: Scan exact ECR digest and record release artifact
        env:
          IMAGE: ${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}
        run: |
          TRIVY_USERNAME=AWS TRIVY_PASSWORD="$(aws ecr get-login-password --region "$REGION")" python scripts/security_scan.py image "$IMAGE"
          mkdir -p artifacts
          printf '%s\n' "$IMAGE" > "artifacts/$SERVICE-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: "gitops-${{ matrix.service }}-image",
            path: "artifacts/*-image.txt",
          }
      - name: Remove temporary registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/docker-config/config.json"
  publish:
    needs: [profile, images]
    runs-on: ubuntu-latest
    environment: aws-test
    timeout-minutes: 15
    env:
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY || 'surendarrajasekaran/infra-helm-charts' }}
      TARGET: idea-board-aws-test
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      DATABASE_CIDRS: ${{ vars.DATABASE_EGRESS_CIDRS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.19.0 }
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: gitops-profile, path: artifacts/profile }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          {
            pattern: gitops-*-image,
            path: artifacts/images,
            merge-multiple: true,
          }
      - name: Publish the desired release to the dedicated GitOps repository
        env:
          GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/gitops-key"
          printf '%s\n' "$GITOPS_SSH_KEY" > "$key"
          cat > "$RUNNER_TEMP/gitops-ssh" <<'SH'
          #!/bin/sh
          exec ssh -i "$RUNNER_TEMP/gitops-key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/github_known_hosts" -o StrictHostKeyChecking=yes "$@"
          SH
          chmod 700 "$RUNNER_TEMP/gitops-ssh"
          export GIT_SSH="$RUNNER_TEMP/gitops-ssh"
          trap 'rm -f "$RUNNER_TEMP/gitops-key" "$RUNNER_TEMP/gitops-ssh"' EXIT
          git clone "git@github.com:$GITOPS_REPOSITORY.git" "$RUNNER_TEMP/gitops"
          args=()
          while IFS= read -r cidr; do args+=(--database-egress-cidr "$cidr"); done < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["DATABASE_CIDRS"])))')
          python scripts/gitops_release.py --gitops-dir "$RUNNER_TEMP/gitops" --target "$TARGET" \
            --release-id "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-commit "$GITHUB_SHA" \
            --environment test --profile artifacts/profile/profile.json --public-url "$PUBLIC_URL" \
            --frontend-image "$(cat artifacts/images/frontend-image.txt)" \
            --backend-image "$(cat artifacts/images/backend-image.txt)" "${args[@]}"
          git -C "$RUNNER_TEMP/gitops" config user.name 'idea-board-release[bot]'
          git -C "$RUNNER_TEMP/gitops" config user.email 'idea-board-release@users.noreply.github.com'
          git -C "$RUNNER_TEMP/gitops" add helm-overides argocd-manifests releases
          git -C "$RUNNER_TEMP/gitops" commit -m "release($TARGET): $GITHUB_SHA"
          git -C "$RUNNER_TEMP/gitops" push origin HEAD:main
          echo 'Desired state published. Argo CD reconciles it; the GitOps repository health workflow verifies the exact release.' >> "$GITHUB_STEP_SUMMARY"
