name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: ideas
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ideas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ideas -d ideas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: backend
      TEST_DATABASE_URL: postgresql+psycopg://ideas:ci-only-password@localhost:5432/ideas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/gitops-chart
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: backend/requirements-dev.txt,
          }
      - run: pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: ruff check backend scripts tests
      - run: pytest -q backend/tests
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.19.0 }
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/gitops-chart
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "1.11.4" }
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test -no-color
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.19.0 }
      - run: helm lint "$GITOPS_DIR/helm-common/nucleus" -f "$GITOPS_DIR/helm-overides/idea-fe/custom-values.yaml"
      - run: helm lint "$GITOPS_DIR/helm-common/nucleus" -f "$GITOPS_DIR/helm-overides/idea-be/custom-values.yaml"
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: python3 scripts/smoke.py --url http://localhost:8080
      - name: Verify data survives backend restart
        run: |
          curl --fail --silent http://localhost:8080/api/ideas > /tmp/ideas-before.json
          docker compose restart backend
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/health/ready && break
            sleep 2
          done
          curl --fail --silent http://localhost:8080/api/ideas > /tmp/ideas-after.json
          diff /tmp/ideas-before.json /tmp/ideas-after.json
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: python3 scripts/security_scan.py config
