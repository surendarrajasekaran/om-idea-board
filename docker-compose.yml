services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-ideas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    command: [python, -m, app.migrate]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ideas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ideas}
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ideas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ideas}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:${APP_PORT:-8080}:8080']
    environment:
      BACKEND_HOST: backend
      NGINX_ENVSUBST_FILTER: BACKEND_HOST
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
