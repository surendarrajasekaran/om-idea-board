server {
    listen 8080;
    ${TLS_LISTEN}
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8k;
    limit_req_status 429;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Idea-Board-Release ${RELEASE_ID} always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location /api/ {
        limit_req zone=ideas burst=20 nodelay;
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
    }
    location = /health/ready { proxy_pass http://${BACKEND_HOST}:8000/health/ready; }
    location = /health/release { proxy_pass http://${BACKEND_HOST}:8000/health/release; }
    location = /health/live { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
}
