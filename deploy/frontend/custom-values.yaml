# Values for the supplied, unmodified nucleus 1.1.0 chart.
fullnameOverride: idea-board-frontend
containerName: frontend
image:
  repository: ghcr.io/surendarrajasekaran/om-idea-board/frontend
  tag: latest # deploy.py requires an explicit release image; this is render-only default.
  pullPolicy: IfNotPresent
workload:
  enabled: true
  kind: Deployment
  replicaCount: 1
  deployment:
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
service:
  enabled: true
  type: LoadBalancer
  port: 80 # Used by the chart's NOTES template.
  ports:
    - { name: http, port: 80, targetPort: 8080, protocol: TCP }
containerPorts:
  - { name: http, containerPort: 8080, protocol: TCP }
env:
  BACKEND_HOST: idea-board-backend
  NGINX_ENVSUBST_FILTER: BACKEND_HOST
automountServiceAccountToken: false
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
# Nginx's entrypoint renders /etc/nginx/conf.d/default.conf at startup.
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
livenessProbe:
  httpGet: { path: /health/live, port: http }
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet: { path: /health/ready, port: http }
  periodSeconds: 5
  timeoutSeconds: 3
startupProbe:
  httpGet: { path: /health/live, port: http }
  periodSeconds: 5
  failureThreshold: 30
podDisruptionBudget: { enabled: true, minAvailable: 1 }
