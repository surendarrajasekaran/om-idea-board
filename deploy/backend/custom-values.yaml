# Values for the supplied, unmodified nucleus 1.1.0 chart.
fullnameOverride: idea-board-backend
containerName: backend
image:
  repository: ghcr.io/surendarrajasekaran/om-idea-board/backend
  tag: latest # Overridden by deploy.py with the selected release image.
  pullPolicy: IfNotPresent
workload:
  enabled: true
  kind: Deployment
  replicaCount: 1
  deployment:
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
service:
  enabled: true
  type: ClusterIP
  ports:
    - { name: http, port: 8000, targetPort: 8000, protocol: TCP }
containerPorts:
  - { name: http, containerPort: 8000, protocol: TCP }
envFrom:
  - secretRef: { name: idea-board-database }
automountServiceAccountToken: false
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
initContainers:
  - name: migrate
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    imagePullPolicy: IfNotPresent
    command: [python, -m, app.migrate]
    envFrom:
      - secretRef: { name: idea-board-database }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
livenessProbe:
  httpGet: { path: /health/live, port: http }
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet: { path: /health/ready, port: http }
  periodSeconds: 5
  timeoutSeconds: 3
startupProbe:
  httpGet: { path: /health/live, port: http }
  periodSeconds: 5
  failureThreshold: 30
podDisruptionBudget: { enabled: true, minAvailable: 1 }
